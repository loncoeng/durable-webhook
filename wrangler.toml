name = "durable-webhook"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Served at <worker>.<subdomain>.workers.dev. On by default, but leaving it
# implicit means a warning on every deploy.
workers_dev = true

# Per-deploy preview URLs, for comparing versions during development. Unused
# here, and off so that there are no more published URLs than necessary.
preview_urls = false

# Sweep the pending deliveries and retry them. Only the ones whose backoff has
# elapsed are actually sent; an empty sweep costs one KV list and nothing else.
#
# Five minutes because of the KV free tier. list is metered at 1,000 a day and
# is **the smallest allowance on the tier** (reads get 100,000). Sweeping every
# minute is 1,440 a day with no visitors at all, and from the moment that is
# crossed the day's retries stop.  288 a day leaves room for three endpoints.
#
# The first delivery is attempted from waitUntil the moment the event arrives,
# so a slow sweep does not delay it. What this costs is retry granularity: the
# first retry lands 1–5 minutes later rather than exactly 1.
[triggers]
crons = ["*/5 * * * *"]

# Holds what has been received, what is pending, and the dead letters.
# The id below is this author's namespace. To run your own, create one with
# wrangler kv namespace create WEBHOOKS and put it here instead.
[[kv_namespaces]]
binding = "WEBHOOKS"
id = "e69f051a37e242c3b4fe6f0fa7a116ef"

# ENDPOINTS contains destination URLs and signing keys. It does not go here;
# register it with wrangler secret put ENDPOINTS.

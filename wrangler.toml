name = "durable-webhook"
main = "src/index.js"
compatibility_date = "2026-08-01"

# <worker名>.<サブドメイン>.workers.dev で公開する。既定でも有効だが、
# 明示しないとデプロイのたびに警告が出る。
workers_dev = true

# デプロイごとにバージョン専用の公開 URL が作られる機能。開発中に
# 版を比べるためのもので、このプロジェクトでは使わない。公開される
# URL を無用に増やさないため無効にする。
preview_urls = false

# 配送待ちを掃いて再試行する。実際に配送するのはバックオフの期限が来た
# ものだけで、空振りは KV の list 1 回で終わる。
#
# 間隔を 5 分にしているのは KV の無料枠の都合。list は 1 日 1,000 回までで、
# **無料枠で最も少ない操作**である (読み取りは 100,000 回)。1 分ごとに回すと
# 訪問者がゼロでも 1 日 1,440 回になり、上限を超えた時点でその日の再試行が
# 止まる。5 分なら 288 回で、エンドポイントを 3 つ持っても収まる。
#
# 1 回目の配送は受け取った時点で waitUntil から試すので、ここが遅くても
# 最初の配送は遅れない。効くのは再試行の粒度だけで、初回の再試行が
# 1 分後ではなく 1〜5 分後になる。
[triggers]
crons = ["*/5 * * * *"]

# 受け取り・配送待ち・退避をここに置く。
# 下の id はこのリポジトリの作者の名前空間。自分で動かすときは
# wrangler kv namespace create WEBHOOKS で作り直して差し替える。
[[kv_namespaces]]
binding = "WEBHOOKS"
id = "e69f051a37e242c3b4fe6f0fa7a116ef"

# ENDPOINTS は転送先の URL と署名の鍵を含む。ここには書かず、
# wrangler secret put ENDPOINTS で登録する。

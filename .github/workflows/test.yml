name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called from deploy. Reused rather than copied over there, so that nothing
  # gets shipped without having passed these.
  workflow_call:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # The only dependency is wrangler, which the tests do not need. What is
      # tested is the part that reaches no external service.
      - run: npm run check
      - run: npm test

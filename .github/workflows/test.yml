name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy から呼ぶ。テストを通っていないものを配らないため、
  # 同じ内容を deploy 側に書き写さずに再利用する。
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 依存は wrangler だけで、テストには要らない。
      # 検査対象は外部サービスに触れない純粋な部分に絞ってある。
      - run: npm run check
      - run: npm test

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy から呼ぶ。テストを通っていないものを配らないため、
  # 同じ内容を deploy 側に書き写さずに再利用する。
  workflow_call:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # 依存は wrangler だけで、テストには要らない。
      # 検査対象は外部サービスに触れない純粋な部分に絞ってある。
      - run: npm run check
      - run: npm test

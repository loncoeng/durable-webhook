# Ship what lands on main to Cloudflare Workers.
#
# The tests are not copied in here; test.yml is called as it stands. Copied,
# one of the two gets fixed and the other ships something untested.
#
# Two secrets are needed, both under the repository's Settings → Secrets.
#   CLOUDFLARE_API_TOKEN    scoped to editing Workers and nothing else
#   CLOUDFLARE_ACCOUNT_ID   the account being shipped to
#
# ENDPOINTS and ADMIN_TOKEN stay where they are, on the Cloudflare side.
# wrangler deploy does not touch secrets, so shipping again does not clear them.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once. A later one waits for the one in front.
# Cancelling each other out leaves nobody sure which version is live.
concurrency:
  group: deploy
  cancel-in-progress: false

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # A fork has no secrets, so this could only fail. It does not run there.
    if: github.repository == 'loncoeng/durable-webhook'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ship it
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Check that what was shipped actually answers. Without this, "the
      # deploy succeeded but the thing is not running" is recorded as a
      # success.
      - name: Check that it answers
        run: |
          url=https://durable-webhook.loncoeng.workers.dev/
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || true)
            # The response is pretty-printed JSON, so there is whitespace
            # around the colon. Matching the compact form fails even when the
            # right thing arrived.
            if [ "$code" = "200" ] && grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body; then
              echo "It answers."
              cat /tmp/body
              exit 0
            fi
            echo "No answer yet (HTTP $code). Retrying, $attempt/5"
            sleep 10
          done
          echo "Shipped, but it never answered."
          exit 1
